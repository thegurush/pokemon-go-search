name: Check availability sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read and compare public release lists without changing the website
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, urllib.request
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          match = re.search(r'const POKEMON=(\[.*?\]);', html, re.S)
          if not match:
              raise ValueError('Cannot locate the saved application species list')
          baseline = {row['id'] for row in json.loads(match[1])}
          if not baseline:
              raise ValueError('Empty application species list')
          today = datetime.datetime.now(datetime.timezone.utc).date()
          sources = {
              'Dated release list': 'https://raw.githubusercontent.com/francescog91/pokemon-go-unreleased/main/pokemon-lists/unreleased-report-full.json',
              'PvPoke release flags': 'https://raw.githubusercontent.com/pvpoke/pvpoke/master/src/data/gamemaster.json',
          }
          results = []
          for name, url in sources.items():
              result = {'source': name, 'url': url}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'TapToSearch-source-check/1.0', 'Accept': 'application/json'})
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read(5_000_001)
                      result['http_status'] = response.status
                  if len(raw) > 5_000_000:
                      raise ValueError('Unexpectedly large response')
                  data = json.loads(raw)
                  if name == 'Dated release list':
                      snapshot = datetime.date.fromisoformat(data['date'])
                      if snapshot > today:
                          raise ValueError('Future snapshot date')
                      rows = data['items']
                      seen, released = set(), set()
                      for row in rows:
                          number = row['id']
                          if type(number) is not int or number <= 0 or number in seen:
                              raise ValueError('Invalid or duplicate species ID')
                          seen.add(number)
                          if not isinstance(row['name'], str) or not row['name'].strip():
                              raise ValueError('Missing species name')
                          release = datetime.date.fromisoformat(row['releaseDate'])
                          if release < today:
                              released.add(number)
                      result['snapshot_date'] = snapshot.isoformat()
                  else:
                      released = set()
                      for row in data['pokemon']:
                          if type(row['dex']) is not int or row['dex'] <= 0 or type(row['released']) is not bool:
                              raise ValueError('Invalid ID or release flag')
                          if row['released']:
                              released.add(row['dex'])
                  if len(released & baseline) < len(baseline) * 0.98:
                      raise ValueError('Source covers less than 98% of saved species')
                  result.update(status='READABLE', species=len(released), missing=sorted(baseline-released), additions=sorted(released-baseline), sha256=hashlib.sha256(raw).hexdigest())
              except Exception as error:
                  result.update(status='FAILED', error=str(error))
              results.append(result)
          report = {'checked_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'saved_species': len(baseline), 'results': results}
          pathlib.Path('source-check.json').write_text(json.dumps(report, indent=2)+'\n')
          summary = ['# Availability source check', '', 'Read-only test: no application files changed and nothing deployed.', '']
          for result in results:
              summary.append('## '+result['source']+' — '+result['status'])
              summary.append('```json\n'+json.dumps(result, indent=2)+'\n```')
          summary.append('Readable does not establish ongoing maintenance or prove every release date. Review before connecting the daily updater.')
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(summary))
          print(json.dumps(report, indent=2))
          if any(result['status'] != 'READABLE' for result in results):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-check
          path: source-check.json
          if-no-files-found: warn
