name: Publish tested website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r updater/requirements.txt
      - name: Run updater and preservation regression checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/preservation.cjs
          node tests/sliders.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Verify actual browser startup before publication
        run: node tests/browser.cjs
      - name: Stage tracked website files and preserve other pages/assets
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site --exclude='.github' --exclude='updater' --exclude='tests' --exclude='CHECKPOINT.md' --exclude='baselines'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify hosted HTML
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python updater/verify_hosted.py "$SITE_URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-browser-evidence
          path: test-results/*.png
