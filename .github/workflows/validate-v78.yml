name: Validate V78 candidate
on:
  push:
    branches: [v78-browser-validation]
    paths: [v78-validation.zip, .github/workflows/validate-v78.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.ref == 'refs/heads/v78-browser-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract candidate
        working-directory: .
        run: |
          echo "f8a1fe795948ad71db20b33649c583889abc7984102e065474bf1121096dfd9e  v78-validation.zip" | sha256sum --check --strict
          mkdir candidate
          unzip -q v78-validation.zip -d candidate
      - name: Correct Count keyboard test to use approved arrow controls
        working-directory: .
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib
          html = Path('candidate/index.html')
          before_html = hashlib.sha256(html.read_bytes()).hexdigest()
          target = Path('candidate/tests/ranking-real-browser.cjs')
          source = target.read_text()
          before = "await p.getByRole('slider').press('End');"
          after = "for(let value=11;value<=30;value++){await p.getByRole('slider').press('ArrowRight');A.equal(await p.getByRole('slider').getAttribute('aria-valuenow'),String(value));}"
          assert source.count(before) == 1, 'Unexpected candidate test; stop instead of applying an uncertain correction'
          target.write_text(source.replace(before, after))
          assert hashlib.sha256(html.read_bytes()).hexdigest() == before_html, 'Application must remain unchanged'
          print('Corrected test-only keyboard interaction; all assertions retained. Application SHA256:', before_html)
          PYCODE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r updater/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Preservation and production sliders
        run: |
          node tests/preservation.cjs
          node tests/sliders.cjs
      - name: Ranking policy, snapshots, selection and restrictions
        run: |
          node tests/rankings.cjs
          node tests/ranking_build.cjs
          node tests/ranking_session.cjs
          node tests/ranking_restrictions.cjs
          node tests/automatic_mega_moves.cjs
          node tests/move_search.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Full Chromium browser verification
        run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v78-browser-evidence
          path: candidate/test-results/*.png
      - name: Record validation scope
        if: always()
        run: cat VALIDATION_HANDOFF.md >> "$GITHUB_STEP_SUMMARY"
