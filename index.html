<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18242e"><title>Pokémon GO Search String Generator</title><style>
@import url("https://fonts.googleapis.com/css2?family=Lilita+One&display=swap");
:root{
  --bg:#26352f;
  --bg-deep:#1f2b27;
  --panel:#334139;
  --cream:#f3e7d0;
  --muted:#c7bda9;
  --orange:#e7a338;
  --yellow:#e8be58;
  --green:#8caf69;
  --teal:#48a38c;
  --blue:#64829a;
  --red:#c45f57;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:"Lilita One",sans-serif}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom));min-height:100dvh;background:var(--bg)}
header{position:sticky;top:0;z-index:20;padding:max(12px,env(safe-area-inset-top)) 10px 12px;background:#2b3933;border-bottom:3px solid var(--yellow);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.head{max-width:1100px;margin:auto}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:"Lilita One",sans-serif;font-size:clamp(25px,6.8vw,44px);font-weight:700;-webkit-text-stroke:.65px currentColor;margin:0 0 5px;letter-spacing:.025em;color:var(--cream);line-height:.98;text-transform:none}
h1::after{content:"";display:block;width:64px;height:5px;margin-top:8px;background:var(--red)}
.count{font-family:"Lilita One",sans-serif;font-size:11px;color:var(--yellow);white-space:nowrap;font-weight:400;letter-spacing:.03em}
.sub{font-family:"Lilita One",sans-serif;font-size:11px;font-weight:400;line-height:1.35;color:#d8ccb6;margin:0 0 11px;max-width:780px}
#search{font-family:"Lilita One",sans-serif;width:100%;height:47px;border:3px solid var(--blue);border-radius:5px;background:#202d29;color:var(--cream);font-family:"Lilita One",sans-serif;font-size:15px;font-weight:400;padding:0 13px;outline:none;box-shadow:inset 0 0 0 2px #18221f,4px 4px 0 rgba(0,0,0,.16)}
#search::placeholder{color:#bdb4a4}
#search:focus{border-color:var(--yellow);box-shadow:inset 0 0 0 2px #18221f,4px 4px 0 rgba(0,0,0,.16)}
main{max-width:1100px;margin:auto;padding:10px 6px 18px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(5px,1.35vw,10px)}
.card{--accent:var(--blue);min-width:0;width:100%;aspect-ratio:.82;border:3px solid var(--accent);border-radius:7px;background:var(--panel);color:var(--cream);padding:clamp(3px,1vw,9px);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease;position:relative;overflow:hidden;box-shadow:3px 3px 0 rgba(0,0,0,.16)}
.card::before{content:"";position:absolute;left:-1px;top:-1px;width:20px;height:20px;background:var(--accent);clip-path:polygon(0 0,100% 0,0 100%);opacity:.98}
.card::after{content:"";position:absolute;right:-1px;bottom:-1px;width:18px;height:18px;background:var(--accent);clip-path:polygon(100% 0,100% 100%,0 100%);opacity:.92}
.card:active{transform:scale(.96)}
.card:hover{box-shadow:4px 4px 0 rgba(0,0,0,.2)}
.card.selected{border-color:var(--cream);background:#4a4038;box-shadow:inset 0 0 0 3px var(--red),0 0 0 1px var(--cream),4px 4px 0 rgba(0,0,0,.2)}
.card.selected::before,.card.selected::after{background:var(--cream)}
@keyframes selectionBounce{0%{transform:scale(1)}35%{transform:scale(1.055)}65%{transform:scale(.985)}100%{transform:scale(1)}}
.card.selection-pop{animation:selectionBounce .22s ease-out}
@media (prefers-reduced-motion:reduce){.card.selection-pop{animation:none}}
.sprite{width:clamp(42px,11vw,78px);height:clamp(42px,11vw,78px);object-fit:contain;display:block;image-rendering:pixelated;image-rendering:crisp-edges;transform:scale(1.35);transform-origin:center;margin:-2px 0}
.num{font-family:"Lilita One",sans-serif;font-size:clamp(6px,1.65vw,10px);color:var(--accent);margin:2px 0;font-weight:700;letter-spacing:.02em}
.name{font-family:"Lilita One",sans-serif;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-family:"Lilita One",sans-serif;font-size:clamp(7px,2vw,13px);font-weight:700;line-height:1.08;color:var(--cream);letter-spacing:.01em}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:45px 20px;font-family:"Lilita One",sans-serif}
footer{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#27332f;border-top:3px solid var(--teal);box-shadow:0 -3px 0 rgba(0,0,0,.16)}
.foot{max-width:1100px;margin:auto;display:flex;gap:7px}
.out{font-weight:400;flex:1;min-width:0;height:45px;border:3px solid var(--blue);border-radius:5px;background:#202d29;color:var(--cream);font:400 12px "Lilita One",sans-serif;padding:0 10px;outline:none;box-shadow:inset 0 0 0 2px #18221f,4px 4px 0 rgba(0,0,0,.14)}
.out:focus{border-color:var(--yellow)}
.copy{font-family:"Lilita One",sans-serif;height:45px;min-width:78px;border:3px solid #bd7a21;border-radius:5px;background:var(--orange);color:#2d2418;font-family:"Lilita One",sans-serif;font-size:14px;font-weight:700;box-shadow:4px 4px 0 rgba(0,0,0,.18)}
.copy:active{transform:translate(1px,1px);box-shadow:2px 2px 0 rgba(0,0,0,.18)}
.copy.copied{background:var(--red);border-color:#8f4742;color:var(--cream)}

.page-corner.left{left:0}
.page-corner.right{right:0}
.page-corner span{position:absolute;display:block;height:15px;transform:rotate(-45deg);transform-origin:center}
.page-corner.left span:nth-child(1){width:110px;left:-38px;bottom:15px;background:var(--orange)}
.page-corner.left span:nth-child(2){width:92px;left:-27px;bottom:35px;background:var(--green)}
.page-corner.left span:nth-child(3){width:74px;left:-16px;bottom:55px;background:var(--blue)}
.page-corner.right span:nth-child(1){width:110px;right:-38px;bottom:15px;background:var(--red);transform:rotate(45deg)}
.page-corner.right span:nth-child(2){width:92px;right:-27px;bottom:35px;background:var(--teal);transform:rotate(45deg)}
.page-corner.right span:nth-child(3){width:74px;right:-16px;bottom:55px;background:var(--yellow);transform:rotate(45deg)}
@media(max-width:360px){#grid{gap:3px}.card{border-radius:6px;padding:2px}.name{font-size:7px}.num{font-size:6px}.copy{min-width:62px}.page-corner span{height:11px}}

</style></head><body>

<footer><div class="foot"><input id="output" class="out" readonly placeholder="Select Pokémon…" aria-label="Generated Pokémon GO search string"><button id="copy" class="copy" type="button">Copy</button></div></footer>

// Exact September 29, 2026 cutoff validation.
// The supplied Pokémon GO Wiki PDF reports 956 released species at the cutoff.
// The 69 omitted National Dex IDs are the species not yet released by that date.
const UNRELEASED_CUTOFF_IDS = new Set([489, 490, 493, 746, 771, 772, 773, 774, 801, 833, 834, 868, 869, 871, 875, 878, 879, 880, 881, 882, 883, 896, 897, 898, 902, 946, 947, 951, 952, 953, 954, 963, 964, 967, 976, 981, 984, 985, 986, 987, 988, 989, 990, 991, 992, 993, 994, 995, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1014, 1015, 1016, 1017, 1018, 1020, 1021, 1022, 1023, 1024, 1025]);
if (POKEMON.length !== 956) throw new Error('Release manifest count mismatch: expected 956.');
if (new Set(POKEMON.map(p => p.id)).size !== 956) throw new Error('Duplicate Pokémon ID in manifest.');

if (UNRELEASED_CUTOFF_IDS.size !== 69) throw new Error('Unreleased-ID set mismatch.');

if (!POKEMON.some(p => p.id === 942 && p.name === 'Maschiff')) throw new Error('Maschiff #942 missing.');
if (!POKEMON.some(p => p.id === 943 && p.name === 'Mabosstiff')) throw new Error('Mabosstiff #943 missing.');
const SPRITE_BASE='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
const selected=new Set();const grid=document.getElementById('grid'),search=document.getElementById('search'),output=document.getElementById('output'),copy=document.getElementById('copy'),count=document.getElementById('count');
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function results(){const q=norm(search.value.trim());return q?POKEMON.filter(p=>norm(p.name).includes(q)||String(p.id).includes(q)):POKEMON;}
function updateOutput(){output.value=POKEMON.filter(p=>selected.has(p.id)).sort((a,b)=>a.id-b.id).map(p=>norm(p.name).replace(/[^a-z0-9]/g,'')).join(',');}
const BASE_SPRITE_SCALE=1.35;
const TARGET_VISIBLE_PX=54;
const CARD_PALETTE=[
  {accent:'#e7a338',bg:'#3b4037'},
  {accent:'#e8be58',bg:'#3d4136'},
  {accent:'#8caf69',bg:'#374338'},
  {accent:'#48a38c',bg:'#33433e'},
  {accent:'#64829a',bg:'#354149'},
  {accent:'#c45f57',bg:'#453a38'}
];
const cardColor=new Map();
(function assignCardColors(){
  let previous=-1;
  for(const p of POKEMON){
    let idx=Math.floor(Math.random()*CARD_PALETTE.length);
    if(CARD_PALETTE.length>1 && idx===previous) idx=(idx+1+Math.floor(Math.random()*(CARD_PALETTE.length-1)))%CARD_PALETTE.length;
    cardColor.set(p.id,CARD_PALETTE[idx]);
    previous=idx;
  }
})();
const MAX_EXTRA_SCALE=1.65;
function normalizeSprite(img){
  const applyFallback=()=>{img.style.transform=`scale(${BASE_SPRITE_SCALE})`;};
  if(!img.naturalWidth||!img.naturalHeight){applyFallback();return;}
  try{
    const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
    const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
    const data=ctx.getImageData(0,0,c.width,c.height).data;
    let minY=c.height,maxY=-1;
    for(let y=0;y<c.height;y++) for(let x=0;x<c.width;x++) if(data[(y*c.width+x)*4+3]>12){if(y<minY)minY=y;if(y>maxY)maxY=y;}
    if(maxY<0){applyFallback();return;}
    const visibleRatio=(maxY-minY+1)/c.height;
    const boxPx=img.getBoundingClientRect().height;
    const currentVisible=boxPx*BASE_SPRITE_SCALE*visibleRatio;
    const extra=Math.min(MAX_EXTRA_SCALE,Math.max(1,TARGET_VISIBLE_PX/currentVisible));
    img.style.transform=`scale(${BASE_SPRITE_SCALE*extra})`;
  }catch(e){applyFallback();}
}
function render(){const list=results();grid.replaceChildren();count.textContent=list.length+' / '+POKEMON.length;if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='No Pokémon found.';grid.appendChild(e);return;}const f=document.createDocumentFragment();for(const p of list){const b=document.createElement('button');b.type='button';b.className='card'+(selected.has(p.id)?' selected':'');b.setAttribute('aria-pressed',selected.has(p.id));const img=document.createElement('img');img.className='sprite';img.src=SPRITE_BASE+p.id+'.png';img.alt='';img.width=64;img.height=64;img.loading='lazy';img.decoding='async';img.crossOrigin='anonymous';img.onload=()=>normalizeSprite(img);const colors=cardColor.get(p.id)||CARD_PALETTE[0];b.style.setProperty('--accent',colors.accent);b.style.background=colors.bg;const n=document.createElement('div');n.className='num';n.textContent='#'+String(p.id).padStart(3,'0');const name=document.createElement('div');name.className='name';name.textContent=p.name;b.append(img,n,name);b.onclick=()=>{const isSelected=selected.has(p.id);if(isSelected) selected.delete(p.id); else selected.add(p.id);const nowSelected=!isSelected;b.classList.toggle('selected',nowSelected);b.setAttribute('aria-pressed',nowSelected?'true':'false');if(nowSelected){b.classList.remove('selection-pop');void b.offsetWidth;b.classList.add('selection-pop');}else{b.classList.remove('selection-pop');}updateOutput();};f.appendChild(b);}grid.appendChild(f);}
search.addEventListener('input',render);
async function doCopy(){if(!output.value)return;try{await navigator.clipboard.writeText(output.value);}catch(e){const t=document.createElement('textarea');t.value=output.value;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.focus();t.select();document.execCommand('copy');t.remove();}copy.textContent='Copied!';copy.classList.add('copied');setTimeout(()=>{copy.textContent='Copy';copy.classList.remove('copied');},1200);}copy.onclick=doCopy;render();
</script></body></html>
