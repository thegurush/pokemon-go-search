/*
  V31 V15 architectural rebuild
  --------------------------------
  CARD/Sprite contract:
    --card-w and --card-h are never changed.
    .card and .sprite rules from V15 are never changed.
    No script touches individual cards or sprites.

  Grid contract:
    - fixed card tracks
    - one identical dynamically calculated gap for all deck edges and rows
    - gap stays visually close to the former 10px target
    - no max-width or column-count ceiling
    - no ResizeObserver feedback loop
    - no scroll listener
*/
html,body{
  width:100%;
  min-width:0;
  margin:0;
}

body{
  overflow-x:hidden;
}

/* The chrome containers are full-width. Their inner content is what is
   compensated for browser zoom; the card deck never participates in that
   compensation. */
header{
  box-sizing:border-box;
  width:100%;
  max-width:none;
  padding-left:10px;
  padding-right:10px;
}

.head{
  width:100%;
  max-width:none;
  margin:0;
}

main{
  width:100%;
  max-width:none;
  margin:0;
  padding-left:0;
  padding-right:0;
  box-sizing:border-box;
}

footer{
  box-sizing:border-box;
  width:100%;
  max-width:none;
  left:0;
  right:0;
}

.foot{
  width:100%;
  max-width:none;
  margin:0;
}

/* V16's successful typography decision: remove synthetic bolding without
   changing the V15 typeface or card geometry. */
body,body *{
  font-weight:400 !important;
}

h1{
  font-size:44px !important;
  line-height:.98 !important;
  white-space:nowrap !important;
  -webkit-text-stroke:0 !important;
}

.sub{
  font-size:11px !important;
  line-height:1.35 !important;
  white-space:nowrap !important;
}

#search{
  height:47px !important;
  font-size:15px !important;
}

.out{
  height:45px !important;
  font-size:12px !important;
}

.copy{
  height:45px !important;
  font-size:14px !important;
}

/*
  The deck is deliberately not given a max-width. V35 chooses the fixed
  number of 79px tracks and one shared gap from the actual available width.
  That same gap is used for the left/right/top/bottom deck edges and every
  inter-card row/column gap.
*/
#grid{
  box-sizing:border-box !important;
  width:100% !important;
  max-width:none !important;
  margin:0 !important;
  padding:0;
  display:grid !important;
  justify-content:start;
  align-content:start;
  grid-auto-rows:var(--card-h) !important;
}

/*
  Keep the fixed chrome out of the grid's geometry. These are only layout
  reservations; the visible inner chrome is compensated separately by JS.
*/
</style>

#tts-active .tts-circle{height:19px;width:19px}
#tts-active .tts-portions .tts-cell{height:21px}
.tts-portions{height:21px}
.tts-structural-divider{height:13px}
.tts-range,.tts-iv{height:43px}
.tts-regions{grid-template-rows:17px 17px;gap:3px;margin:2px 4px}
.tts-toggle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:39px;padding:2px 3px;line-height:1;text-decoration:none!important}
.tts-toggle-label{font-size:9px;white-space:nowrap}
.tts-switch-track{position:relative;display:block;width:28px;height:14px;border:1px solid var(--muted);border-radius:10px;background:#4b574d;box-shadow:inset 0 1px 2px #0004;transition:background .12s}
.tts-switch-thumb{position:absolute;top:1px;left:1px;width:10px;height:10px;border-radius:50%;background:var(--cream);transition:transform .12s}
.tts-toggle[aria-checked=true] .tts-switch-track{background:var(--teal);border-color:var(--teal)}
.tts-toggle.exclude[aria-checked=true] .tts-switch-track{background:var(--semantic-red);border-color:var(--semantic-red)}
.tts-toggle[aria-checked=true] .tts-switch-thumb{transform:translateX(14px)}
.tts-controls-scroll{gap:5px;padding-left:3px}
.tts-controls-scroll .tts-text{padding:2px 4px}
.tts-controls-scroll .tts-toggle{padding:2px 3px}
#tts-message{display:block;align-content:center;font-size:13px;line-height:1.15;overflow:hidden;transition:opacity .35s ease;opacity:1}
#tts-message.warning{color:var(--semantic-red)}
#tts-message .tts-message-name,#tts-message .tts-message-separator{color:var(--cream)}
#tts-message .tts-message-error{color:var(--semantic-red)}
#tts-message.fading{opacity:0}
.tts-badges{gap:4px;left:4px;bottom:4px}
.tts-badge{height:13px;min-width:13px;font-size:9px;line-height:13px;padding:0 2px}
/* One inline text flow prevents flex-fragment gaps during substring highlights. */
#tts-output{display:block;line-height:39px;overflow-x:auto;overflow-y:hidden;white-space:pre}
#tts-output-text{display:inline-block;vertical-align:top;min-width:0;white-space:pre}
#tts-output mark{display:inline;padding:0;margin:0;font:inherit;line-height:inherit;vertical-align:baseline}
@media(max-width:360px){

 .tts-fixture:not(:empty):before,#tts-parent:not(:empty):after{margin:0 2px}
}
@media(prefers-reduced-motion:reduce){#tts-message,.tts-switch-track,.tts-switch-thumb{transition:none}}

/*
  Sprite layout rules:
  1. Read the transparent PNG once and crop away only transparent padding.
  2. Put the cropped artwork into a normal flex slot.
  3. Size the visible artwork to a consistent target, with a hard maximum.
  4. The slot itself supplies the vertical baseline, so there are no negative
     left/bottom offsets and no transform math that can push artwork outside a card.
*/
function normalizeSprite(img){
  if(!img.naturalWidth || !img.naturalHeight) return;
  if(img.dataset.cropped==='1'){
    sizeCroppedSprite(img);
    return;
  }

  try{
    const c=document.createElement('canvas');

    c.height=img.naturalHeight;

          if(x<minX)minX=x;
          if(y<minY)minY=y;
          if(x>maxX)maxX=x;
          if(y>maxY)maxY=y;
        }
      }
    }
    if(maxX<0) return;

    const visibleW=maxX-minX+1;
    const visibleH=maxY-minY+1;

    cropped.height=visibleH;

    img.dataset.visibleH=String(visibleH);

    // safe flex slot. This fallback cannot move the image outside the card.
    img.dataset.cropped='fallback';
    img.style.width='64px';
    img.style.height='64px';
    img.style.maxWidth='100%';
    img.style.maxHeight='100%';

    img.classList.add('sprite-ready');

function sizeCroppedSprite(img){
  const slot=img.parentElement;
  if(!slot) return;
  if(!slot) return;
  const vw=Number(img.dataset.visibleW)||img.naturalWidth;
  const vh=Number(img.dataset.visibleH)||img.naturalHeight;
  if(!vw || !vh) return;

  // Charizard's old framing is our reference: roughly 54px of visible artwork.
  // Tiny sprites are brought up toward the same visual scale, while large
  // sprites are reduced as necessary to stay completely inside the card.
  const desired=Math.min(TARGET_VISIBLE_PX, MAX_VISIBLE_PX);
  let scale=desired/Math.max(vw,vh);
  if(Math.max(vw,vh)*scale < MIN_VISIBLE_PX) scale=MIN_VISIBLE_PX/Math.max(vw,vh);

  // The V13 card is the master reference. Do not recompute sprite scale from
  // the card/viewport dimensions: orientation and browser zoom may only add
  // more identical cards, never resize the artwork inside them.
  const maxW=62-SPRITE_EDGE_PADDING*2;
  const maxH=62-SPRITE_EDGE_PADDING*2;
  scale=Math.min(scale,maxW/vw,maxH/vh);

  const w=Math.max(1,Math.round(vw*scale*10)/10);
  const h=Math.max(1,Math.round(vh*scale*10)/10);
  img.style.width=w+'px';
  img.style.height=h+'px';
  img.style.maxWidth='100%';
  img.style.maxHeight='100%';
  img.style.position='static';
  img.style.left='auto';
  img.style.bottom='auto';
  img.style.transform='none';
  img.style.margin='0';
  if(img.classList.contains('sprite-pending')){
    img.classList.remove('sprite-pending');
    img.classList.add('sprite-ready');
  }
}

<script id="v35-fluid-gap-layout-engine">
(function(){
  'use strict';

  const CARD_W = 79;
  const TARGET_GAP = 10;
  let raf = 0;

  /*
    V35 layout architecture:
    - The V15 card is sacred: 79x96. Card geometry and sprite rules are untouched.
    - No hard 6..16px gap band. No artificial max-width or column ceiling.
    - For the current available width, choose the integer column count whose
      resulting shared gap is closest to 10px, while keeping the gap positive.
    - That ONE calculated gap is used for BOTH horizontal and vertical spacing,
      including the deck's left/right/top/bottom padding.
    - The deck therefore always fills the available width without a leftover
      right-side remainder, while keeping the visual gap close to the old target.
    - Layout is recalculated only from viewport/layout changes, never from scroll.
  */
  function solve(width){
    if(!Number.isFinite(width) || width <= 0) return {columns:1,gap:TARGET_GAP};

    // Pick the column count nearest the ideal 10px-gap solution.
    const ideal=(width-TARGET_GAP)/(CARD_W+TARGET_GAP);
    const candidates=new Set();
    const base=Math.floor(ideal);
    for(let n=base-2;n<=base+2;n++){
      if(n>=1) candidates.add(n);
    }

    let best=null;
    for(const n of candidates){
      const gap=(width-n*CARD_W)/(n+1);
      if(gap<0) continue;
      const score=Math.abs(gap-TARGET_GAP);
      if(!best || score<best.score || (score===best.score && n>best.columns)){
        best={columns:n,gap,score};
      }
    }

    if(!best) return {columns:1,gap:Math.max(0,width-CARD_W)/2};
    return {columns:best.columns,gap:best.gap};
  }

  function apply(){
    raf=0;
    const grid=document.getElementById('grid');
    if(!grid) return;
    const width=grid.clientWidth;
    if(!width) return;

    const {columns,gap}=solve(width);
    const g=gap.toFixed(4)+'px';

    grid.style.gridTemplateColumns='repeat('+columns+','+CARD_W+'px)';
    grid.style.columnGap=g;
    grid.style.rowGap=g;
    grid.style.padding=g;
    grid.style.justifyContent='start';
    grid.style.alignContent='start';
  }

  function schedule(){
    if(raf) cancelAnimationFrame(raf);
    raf=requestAnimationFrame(apply);
  }

  window.addEventListener('load',schedule,{passive:true});
  window.addEventListener('resize',schedule,{passive:true});
  window.addEventListener('orientationchange',schedule,{passive:true});
  if(window.visualViewport) window.visualViewport.addEventListener('resize',schedule,{passive:true});
  document.addEventListener('DOMContentLoaded',schedule,{once:true});
  setTimeout(schedule,0);
  setTimeout(schedule,100);
})();
</script>

<script id="v37-fixed-chrome-engine">
(function(){
  'use strict';

  /*
    The important distinction from V18: we never resize the chrome itself.
    We only apply one inverse visual transform for the current visualViewport
    scale, and separately reserve the transformed chrome's physical height.
    The grid remains completely independent.
  */
  const root=document.documentElement;
  const header=document.querySelector('header');
  const footer=document.querySelector('footer');
  let raf=0;

  function update(){
    raf=0;
    if(!header || !footer) return;

    const vv=window.visualViewport;
    const scale=(vv && Number.isFinite(vv.scale) && vv.scale>0) ? vv.scale : 1;
    const inverse=1/scale;

    root.style.setProperty('--chrome-inverse-zoom', String(inverse));

    // Uniform inverse scaling keeps the visual height fixed, but it would
    // also shrink the visual width. Expand the untransformed CSS width by
    // the same zoom factor so after transform the chrome is still exactly
    // the viewport width. Use a pixel value rather than CSS multiplication
    // so Safari does not have to resolve a zoom-sensitive percentage.
    const viewportWidth = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
    const chromeLayoutWidth = viewportWidth * scale;
    root.style.setProperty('--chrome-layout-width', chromeLayoutWidth+'px');

    // offsetHeight is the untransformed CSS layout height. Dividing by the
    // zoom factor reserves exactly the amount of CSS space occupied visually
    // by the counter-scaled fixed chrome.
    const headerSpace=header.offsetHeight*inverse;
    const footerSpace=footer.offsetHeight*inverse;
    root.style.setProperty('--header-space', headerSpace+'px');
    root.style.setProperty('--footer-space', footerSpace+'px');
  }

  function schedule(){
    if(raf) return;
    raf=requestAnimationFrame(update);
  }

  window.addEventListener('load',schedule,{passive:true});
  window.addEventListener('resize',schedule,{passive:true});
  window.addEventListener('orientationchange',schedule,{passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',schedule,{passive:true});
    window.visualViewport.addEventListener('scroll',schedule,{passive:true});
  }
  document.addEventListener('DOMContentLoaded',schedule,{once:true});
  schedule();
})();
</script>

<script id="v41-background-sprite-preload">
(function(){
  'use strict';

  /* V41:
     Preload sprites in normal top-to-bottom order.
     This does not change the V40 visibility gate or sprite sizing.
     It only asks the browser to fetch sprites in the background ahead of use.
  */

  let started = false;

  function getSpriteIds(){
    if(!Array.isArray(POKEMON)) return [];
    return POKEMON.map(p => p && p.id).filter(Boolean);
  }

  function preloadAllSprites(){
    const ids = getSpriteIds();
    if(!ids.length) return;

    const base = (typeof SPRITE_BASE === 'string' ? SPRITE_BASE : '');

    for(const id of ids){
      const img = new Image();
      img.decoding = 'async';
      img.fetchPriority = 'high';
      img.src = base + id + '.png';
    }
  }

  function start(){
    if(started) return;
    started = true;
    preloadAllSprites();
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', start, {once:true});
  }else{
    start();
  }
})();
</script>

 const f=path[0],g=path[1],descriptor=g?GROUPS[g]:FAMILIES[f];parent.append(cell('Back from '+descriptor[0],descriptor[1],'back',()=>navigate(path.slice(0,-1)),{parent:true}));
 const content=FAMILIES[f][3];if(g)renderContent(f,g);else if(Array.isArray(content))content.forEach(x=>middle.append(groupButton(x,f)));else renderContent(f,content);
 }
 renderConfirm();middle.scrollLeft=scrollPos;popKey=null;
}
middle.addEventListener('scroll',()=>{if(S.builder&&!S.visit)S.builder.scroll[key()]=middle.scrollLeft;},{passive:true});
function revealActive(id){requestAnimationFrame(()=>{const node=active.querySelector('[data-filter-id="'+id+'"]');if(node){if(node.offsetLeft<active.scrollLeft)active.scrollLeft=node.offsetLeft;else if(node.offsetLeft+node.offsetWidth>active.scrollLeft+active.clientWidth)active.scrollLeft=node.offsetLeft+node.offsetWidth-active.clientWidth;}});}
function portionFamily(p){return C.portion(p).families[0]||p.provisional;}
function selectPortion(index){
 const b=S.builder;if(!b||S.visit||index===b.index||!b.filter.portions[index])return;
 remember();b.index=index;
 const family=portionFamily(current());b.path=b.paths[index]?[...b.paths[index]]:family&&FAMILIES[family][3]?[family]:[];
 clearMessage();renderUI();renderDeck();revealPortion(index);
}
function addPortion(){
 if(!S.builder||!C.portion(current()).valid)return;
 remember();S.builder.filter.portions.push(newPortion());S.builder.index=S.builder.filter.portions.length-1;S.builder.path=[];
 notify('Add Filter');renderUI();renderDeck();updateFooter();revealPortion(S.builder.index);
}
function revealPortion(index){requestAnimationFrame(()=>{
 const scroller=active.querySelector('.tts-portions'),node=scroller?.querySelector('[data-portion-index="'+index+'"]');if(!node)return;
 const r=node.getBoundingClientRect(),v=scroller.getBoundingClientRect();if(r.left<v.left)scroller.scrollLeft-=v.left-r.left;else if(r.right>v.right)scroller.scrollLeft+=r.right-v.right;
});}
function renderActive(){
 const oldScroller=active.querySelector('.tts-portions');if(oldScroller)structuralScroll=oldScroller.scrollLeft;else if(!active.classList.contains('structural'))normalActiveScroll=active.scrollLeft;
 active.replaceChildren();active.classList.toggle('structural',!!S.builder);active.classList.toggle('frozen',S.popup!==null);
 if(S.builder){
 const b=S.builder,fam=C.filter(b.filter).family||b.filter.portions.map(portionFamily).find(Boolean);
 // Scope-only state has no invented family identity. Add Filter's blank next
 // portion uses the already-established + glyph until its family is known.
 if(!fam){active.hidden=true;return;}
 const d=FAMILIES[fam],anchor=cell('Current Active Filter: '+d[0],d[1],d[2],()=>{});anchor.classList.add('tts-structural-parent');anchor.disabled=true;anchor.dataset.filterId=b.filter.id;
 const separator=el('span','tts-structural-divider');separator.setAttribute('aria-hidden','true');
 const scroller=el('div','tts-portions');scroller.setAttribute('aria-label','Filter portions');scroller.setAttribute('role','group');
 b.filter.portions.forEach((portion,index)=>{
 const family=portionFamily(portion),descriptor=family?FAMILIES[family]:['New portion','#d2b34e','plus'];const chosen=index===b.index;
 const button=cell('Portion '+(index+1)+': '+descriptor[0],descriptor[1],descriptor[2],()=>selectPortion(index),{chosen,disabled:!!S.visit});
 button.dataset.portionIndex=index;button.classList.toggle('in-progress',chosen||!C.portion(portion).valid);button.classList.toggle('open',chosen);button.setAttribute('aria-current',chosen?'true':'false');if(S.visit)button.disabled=true;scroller.append(button);
 });
 active.append(anchor,separator,scroller);active.hidden=false;active.scrollLeft=0;
 const nextKey=String(b.filter.id);if(nextKey!==structuralKey){structuralScroll=0;structuralKey=nextKey;}
 scroller.scrollLeft=structuralScroll;scroller.onscroll=()=>{structuralScroll=scroller.scrollLeft;};
 const signature=nextKey+'/'+b.index+'/'+b.filter.portions.map(p=>portionFamily(p)||'empty').join(',');if(signature!==structuralSignature){structuralSignature=signature;revealPortion(b.index);}return;
 }
 structuralKey='';structuralSignature='';structuralScroll=0;
 for(const f of S.filters){const fam=C.filter(f).family;if(!fam)continue;const d=FAMILIES[fam];const button=cell(d[0]+' filter',d[1],d[2],()=>showPopup(f.id));button.dataset.filterId=f.id;if(S.popup===f.id)button.classList.add('open');active.append(button);}
 active.hidden=!active.children.length;active.scrollLeft=normalActiveScroll;
}
// Structural-tray swipes must never switch portions accidentally.
let portionPointer=null,portionDragged=false;
active.addEventListener('pointerdown',e=>{portionPointer={x:e.clientX,y:e.clientY};portionDragged=false;},{passive:true});
active.addEventListener('pointermove',e=>{if(portionPointer&&Math.hypot(e.clientX-portionPointer.x,e.clientY-portionPointer.y)>8)portionDragged=true;},{passive:true});
active.addEventListener('click',e=>{if(portionDragged){e.preventDefault();e.stopImmediatePropagation();}portionPointer=null;},true);

function words(p){const v=p.values,out=[];const names={types:'type',dual:'dual type',weakness:'weak to',effective:'super effective against',appraisal:'appraisal stars',megalevel:'Mega level',buddylevel:'buddy level',generation:'region',size:'size',maxkind:'Max form',maxattack:'Max Attack level',maxguard:'Max Guard level',maxspirit:'Max Spirit level',catch:'caught through',evolution:'evolution',background:'background'};
 const friendly={evolve:'able to evolve',evolvenew:'new evolution available',item:'evolution item',evolvequest:'evolution quest',tradeevolve:'trade evolution',remoteraid:'remote raid',megaraid:'Mega raid',gbl:'GO Battle League',specialbackground:'special background',locationbackground:'location background',dynamax:'Dynamax',gigantamax:'Gigantamax',xxs:'XXS',xxl:'XXL'};
 if(v.slots?.length||v.movetype||v.elite){const slots=(v.slots||[]).map(n=>['','Fast','first Charged','second Charged'][n]).join(' and ');if(v.slots?.length===1&&v.slots[0]===3&&!v.movetype&&!v.elite)out.push('an unlocked second Charged move');else out.push((slots||'an attack')+(v.movetype?' of '+v.movetype+' type':'')+(v.elite?' with a special / Elite move':''));}
 if(v.weather?.length)out.push('weather-boosted '+v.weather.map(x=>({weather:'attacks','1weather':'Fast attack','2weather':'first Charged attack','3weather':'second Charged attack'})[x]).join(' or '));
 const stats=['attack','defense','hp'].filter(k=>v[k]!==undefined).map(k=>k.toUpperCase()+' IV '+['0','1–5','6–10','11–14','15'][v[k]]);const ratings=(v.appraisal||[]).map(x=>x===4?'perfect appraisal':x+'-star appraisal');if(stats.length&&ratings.length)out.push('either ('+stats.join(' and ')+') or '+ratings.join(' or '));else if(stats.length)out.push(stats.join(' and '));else if(ratings.length)out.push(ratings.join(' or '));
 for(const [k,label] of Object.entries(names))if(k!=='appraisal'&&v[k]?.length)out.push(label+' '+v[k].map(x=>friendly[x]||x).join(k==='dual'||k==='evolution'?' and ':' or '));
 for(const [k,spec] of Object.entries(NUMERIC))if(v[k]?.values?.length){const label=GROUPS[k]?.[0]||FAMILIES[k]?.[0]||k;out.push(label+' '+[...v[k].values].sort((a,b)=>a-b).join(' to '));}
 for(const k of Object.keys(FAMILIES))if(v[k]===true)out.push(FAMILIES[k][0]);if(v.megaevolve)out.push('able to Mega Evolve');if(v.maxeligible)out.push('eligible for Max Battles');if(v.tagmode==='any')out.push('tagged');if(v.tagmode==='none')out.push('untagged');if(v.tagmode==='custom'&&v.tags?.length)out.push('tagged '+v.tags.join(' or '));
 return out.join(' and ');
}
function renderPopup(){const f=S.filters.find(f=>f.id===S.popup);if(!f){S.popup=null;renderUI();return;}popupText.replaceChildren();const fc=C.filter(f);f.portions.forEach((p,i)=>{if(i)popupText.append(document.createTextNode(' and '));if(p.exclude){const n=el('span','','not (');n.style.color='var(--semantic-red)';popupText.append(n);}const text=el('span','',words(p));text.style.color=familyColor(fc.family);popupText.append(text);if(p.exclude){const n=el('span','',')');n.style.color='var(--semantic-red)';popupText.append(n);}});
 const scope=el('span','',f.scope.length?' — applied to '+f.scope.map(id=>pkm.get(id)?.name||id).join(', '):' — applied globally');scope.style.color=f.scope.length?'var(--scope-purple)':'var(--cream)';popupText.append(scope);edit.disabled=!!S.builder;
 const b=active.querySelector('[data-filter-id="'+f.id+'"]');if(b)popup.style.setProperty('--anchor',Math.max(8,Math.min(popup.clientWidth-18,b.offsetLeft-active.scrollLeft+7))+'px');
}
document.addEventListener('click',e=>{const path=e.composedPath();if(S.popup!==null&&!path.includes(popup)&&!path.includes(active)&&!path.includes(tray)){S.popup=null;renderUI();}});
results=function(){const scope=!!S.visit,mode=scope?S.filterMode:S.mainMode,selectedScope=new Set(S.builder?.filter.scope||[]);let pool=POKEMON;
 if(mode.selected)pool=pool.filter(p=>scope?selectedScope.has(p.id):mode.exclude?S.main[p.id]==='exclude':!!S.main[p.id]);
 const q=norm(search.value.trim());if(q){const generation=q.match(/^(?:gen|generation)\s*([1-9])$/);if(TYPES.includes(q))pool=pool.filter(p=>TTS_META[p.id].types.includes(q));else if(generation)pool=pool.filter(p=>TTS_META[p.id].generation===Number(generation[1]));else if(['legendary','mythical','ultra beast','ultrabeast'].includes(q)){const category=q.replace(' ','');pool=pool.filter(p=>TTS_META[p.id][category]);}else pool=pool.filter(p=>norm(p.name).includes(q)||String(p.id).includes(q));}
 if(mode.evo){const chains=new Set(pool.map(p=>TTS_META[p.id].family));pool=POKEMON.filter(p=>chains.has(TTS_META[p.id].family));}return pool;
};
function badgeCounts(id){let purple=0,red=0,previewPurple=0,previewRed=0;for(const f of S.filters){if(S.builder?.editing&&S.builder.filter.id===f.id)continue;const c=f.scope.length?(f.scope.includes(id)?C.filter(f):{purple:false,red:false}):TTSApplicability.badges(f,TTS_META[id]);if(c.purple)purple++;if(c.red)red++;}
 if(S.builder&&!S.visit&&!S.builder.filter.scope.length){const c=TTSApplicability.badges(S.builder.filter,TTS_META[id]);if(c.purple)previewPurple++;if(c.red)previewRed++;}
 if(S.builder?.filter.scope.includes(id)){const portions=S.builder.filter.portions.filter(p=>!C.portion(p).empty);const states=portions.length?portions:[current()];if(states.some(p=>!p.exclude))previewPurple++;if(states.some(p=>p.exclude))previewRed++;}
 return {purple,red,previewPurple,previewRed};}
function decorateCard(b,p){const state=S.main[p.id];b.classList.toggle('selected',state==='include');b.classList.toggle('main-excluded',state==='exclude');b.classList.toggle('passive-main',!!S.visit&&!!state);b.setAttribute('aria-pressed',String(S.visit?S.builder.filter.scope.includes(p.id):!!state));b.setAttribute('aria-label',p.name+(state?' — '+(state==='include'?'Included':'Excluded'):'')+(S.visit&&S.builder.filter.scope.includes(p.id)?' — filter selected':''));b.dataset.pokemonId=p.id;
 b.querySelector('.tts-badges')?.remove();const counts=badgeCounts(p.id);const badges=el('div','tts-badges');badges.setAttribute('aria-hidden','true');b.style.setProperty('--badge-ink',cardColor.get(p.id).bg);
 for(const color of ['purple','red']){const completed=counts[color],currentCount=counts['preview'+(color==='purple'?'Purple':'Red')];if(!completed&&!currentCount)continue;const badge=el('span','tts-badge '+color+(S.visit&&!currentCount?' dim':''),String(completed+currentCount));badges.append(badge);}b.append(badges);
 b.onclick=()=>{const scope=!!S.visit,before=selectedCount(scope);if(S.visit){const set=new Set(S.builder.filter.scope);set.has(p.id)?set.delete(p.id):set.add(p.id);S.builder.filter.scope=[...set];}else{const target=S.mainMode.exclude?'exclude':'include';if(S.main[p.id]===target)delete S.main[p.id];else S.main[p.id]=target;S.mainMode.boot=true;}resetEmptySelected(scope,before);if(S.visit?S.builder.filter.scope.includes(p.id):!!S.main[p.id]){b.classList.remove('selection-pop');void b.offsetWidth;b.classList.add('selection-pop');}refresh(false);};
}
let deckSignature='';
function renderDeck(force=false){const list=results(),signature=list.map(p=>p.id).join(',');if(force||signature!==deckSignature){selected.clear();for(const p of POKEMON)if(S.main[p.id]==='include')selected.add(p.id);originalRender();deckSignature=signature;}const cards=grid.querySelectorAll('.card');cards.forEach((b,i)=>decorateCard(b,list[i]));}
function updateFooter(){
 if(S.visit)return;
 let filters=S.filters;
 if(S.builder){const f=S.builder.filter;if(C.filter(f).valid)lastValid=[clone(f)];filters=S.filters.filter(x=>!S.builder.editing||x.id!==f.id).concat(lastValid);}
 const next=C.compile(S.main,filters,token),before=output.value;if(next===before)return;
 output.value=next;clearTimeout(changedTimer);cancelAnimationFrame(footerFrame);const revision=++footerRevision;
 let a=0;while(a<before.length&&a<next.length&&before[a]===next[a])a++;
 let z=0;while(z<before.length-a&&z<next.length-a&&before[before.length-1-z]===next[next.length-1-z])z++;
 const left=next.slice(0,a),changed=next.slice(a,next.length-z),right=z?next.slice(-z):'';const oldScroll=preview.scrollLeft;
 const mark=el('mark','',changed);previewText.replaceChildren(document.createTextNode(left),mark,document.createTextNode(right));
 const clamp=()=>{preview.scrollLeft=Math.min(Math.max(0,preview.scrollLeft),Math.max(0,preview.scrollWidth-preview.clientWidth));};
 preview.scrollLeft=oldScroll;clamp();
 footerFrame=requestAnimationFrame(()=>{footerFrame=0;if(revision!==footerRevision||!mark.isConnected)return;const r=mark.getBoundingClientRect(),v=preview.getBoundingClientRect();if(r.left<v.left+10)preview.scrollLeft-=v.left+10-r.left;else if(r.right>v.right-10)preview.scrollLeft+=Math.min(r.right-v.right+10,Math.max(0,r.left-v.left-10));clamp();});
 changedTimer=setTimeout(()=>{if(revision!==footerRevision)return;const scroll=preview.scrollLeft;previewText.textContent=next;preview.scrollLeft=scroll;clamp();},850);
}
for(const event of ['pointerdown','touchstart','wheel','keydown'])preview.addEventListener(event,()=>{cancelAnimationFrame(footerFrame);footerFrame=0;},{passive:true});

function refresh(deck=false){remember();renderUI();renderDeck(deck);updateFooter();}
updateOutput=updateFooter;
search.addEventListener('input',()=>{clearMessage();renderDeck();});
copy.onclick=()=>{if(!S.builder)doCopy();};
// Observe only chrome size; use the baseline measurement/compensation engine.
const chromeObserver=new ResizeObserver(()=>window.dispatchEvent(new Event('resize')));chromeObserver.observe(head);
window.TTS={state:S,compiler:C,results,refresh,start:()=>{start();refresh();},choose:setChoice,enterScope,leaveScope,save,discard,beginEdit,showPopup,counts:badgeCounts,selectPortion,token,words};
renderUI();renderDeck(true);updateFooter();
})();
